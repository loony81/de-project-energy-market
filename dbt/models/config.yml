# Tests and documentation come here
version: 2

models:
  - name: stg_wti_oil
    description: "A staging model for WTI Crude Oil price. {{ doc('stg_commodity') }}"
    columns:
      - name: commodity_code
        tests:
          - not_null
          - accepted_values:
              values: ['WTI_USD']
      - name: price
        description: "The daily WTI crude oil closing futures price per barrel on NYMEX."
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
          - unique
  - name: stg_brent_oil
    description: "A staging model for Brent Crude Oil price. {{ doc('stg_commodity') }}"
    columns:
      - name: commodity_code
        tests:
          - not_null
          - accepted_values:
              values: ['BRENT_CRUDE_USD']
      - name: price
        description: "The daily Brent crude oil closing futures price per barrel on ICE Futures."
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
          - unique
  - name: stg_nat_gas
    description: "A staging model for US Natural Gas price. {{ doc('stg_commodity') }}"
    columns:
      - name: commodity_code
        tests:
          - not_null
          - accepted_values:
              values: ['NATURAL_GAS_USD']
      - name: price
        description: "The daily natural gas closing futures price per mmbtu on NYMEX Henry Hub & TTF."
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
          - unique
  - name: stg_urea
    description: "A staging model for Urea price. {{ doc('stg_commodity') }}"
    columns:
      - name: commodity_code
        tests:
          - not_null
          - accepted_values:
              values: ['UREA_USD']
      - name: price
        description: "The daily Urea spot price per metric ton on CME Group."
        tests:
          - not_null
          # unlike oil and gas, the urea price cannot be negative, because it's a manufactured product with high input costs
          - negative_price_check
      - name: price_date
        tests:
          - not_null
          - unique
  - name: fct_daily_commodity_prices
    description: "{{ doc('fct_daily_commodity_prices') }}"
    columns:
      - name: commodity_code
        tests:
          - not_null
          - accepted_values:
              values: ['WTI_USD', 'BRENT_CRUDE_USD', 'NATURAL_GAS_USD', 'UREA_USD']
          - relationships:
              to: ref('dim_commodities')
              field: commodity_code
      - name: price
        description: "The daily closing prices of commodities."
        tests:
          - not_null
          - negative_price_check:
              severity: warn # Although the possibility is extremely low, the price of oil and gas could be negative
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - commodity_code
              - price_date
  - name: mart_pivoted
    description: "{{ doc('mart_pivoted') }}"
    columns:
      - name: price_date
        tests:
          - not_null
          - unique
  - name: mart_joined
    description: "{{ doc('mart_joined') }}"
    columns:
      - name: type
        tests:
          - not_null
          - accepted_values:
              values: ['futures', 'spot']
  - name: mart_metrics
    description: "{{ doc('mart_metrics') }}"
    columns:
      # --- Grain Tests ---
      - name: "(price_date || '-' || commodity_code)" # Testing the composite key
        description: "The unique grain of the table: one record per date per commodity."
        tests:
          - unique
          - not_null

      # --- Math & Logic Tests ---
      - name: volatility_7d
        description: "7-day rolling standard deviation of price."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # Volatility can't be negative

      - name: short_term_trend
        description: "The directional signal based on moving average crossover."
        tests:
          - accepted_values:
              values: ['Short-term Bullish', 'Short-term Bearish', 'Neutral']

      - name: moving_avg_7d
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # a moving average can be negative in the energy market, but it is extremely rare
              severity: warn # Only warn, because 2020 could happen again!
      - name: volatility_30d
        description: "30-day rolling standard deviation of price."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # Volatility can't be negative

      - name: long_term_trend
        description: "The directional signal based on moving average crossover."
        tests:
          - accepted_values:
              values: ['Long-term Bullish', 'Long-term Bearish', 'Neutral']

      - name: moving_avg_30d
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0 # a moving average can be negative in the energy market, but it is extremely rare
              severity: warn # Only warn, because 2020 could happen again!
